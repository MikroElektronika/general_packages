name: Release CODEGRIP Packages

on:
  workflow_dispatch:
    inputs:
      select_index:
        type: choice
        description: Index as Development, Experimental, or Live
        options: [Development, Experimental, Live]
        default: Development
      start_date:
        type: string
        description: First CODEGRIP release date (YYYY-MM-DD)
      end_date:
        type: string
        description: Last CODEGRIP release date (YYYY-MM-DD)

permissions:
  contents: write
  actions: write

jobs:
  release-codegrip-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            general_packages
            core_packages
            mikrosdk_v2

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve channel and ES index
        id: target
        run: |
          case "${{ inputs.select_index }}" in
            Live) echo 'channel=live' >> "$GITHUB_OUTPUT"; echo 'es=${{ secrets.ES_INDEX_LIVE }}' >> "$GITHUB_OUTPUT" ;;
            Experimental) echo 'channel=experimental' >> "$GITHUB_OUTPUT"; echo 'es=${{ secrets.ES_INDEX_EXPERIMENTAL }}' >> "$GITHUB_OUTPUT" ;;
            *) echo 'channel=development' >> "$GITHUB_OUTPUT"; echo 'es=${{ secrets.ES_INDEX_TEST }}' >> "$GITHUB_OUTPUT" ;;
          esac
          echo 'request_id=codegrip-${{ github.run_id }}' >> "$GITHUB_OUTPUT"

      - name: Trigger centralized CODEGRIP database refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run database-external-update.yml --repo MikroElektronika/general_packages --ref main \
            -f request_id='${{ steps.target.outputs.request_id }}' \
            -f channel='${{ steps.target.outputs.channel }}' \
            -f operation=codegrip \
            -f core_release=latest \
            -f core_version=latest \
            -f sdk_version=latest \
            -f mcus_only=false

      - name: Wait for centralized database refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          run_id=''
          for i in {1..60}; do
            run_id="$(gh run list --repo MikroElektronika/general_packages --workflow database-external-update.yml --event workflow_dispatch --json databaseId,displayTitle --jq '.[] | select(.displayTitle | contains("${{ steps.target.outputs.request_id }}")) | .databaseId' | head -1)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Database workflow did not appear'; exit 1; }
          gh run watch "$run_id" --repo MikroElektronika/general_packages --exit-status

      - name: Refresh checkout after database commit
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements/shared.txt
          pip install -r scripts/requirements/databases.txt

      - name: Index CODEGRIP packs
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: |
          python -u scripts/database/index_codegrip_packages.py \
            '${{ steps.target.outputs.es }}' '${{ secrets.PROG_DEBUG_CODEGRIP_LIVE }}' \
            '${{ inputs.start_date }}' '${{ inputs.end_date }}' > message.txt
          cat message.txt

      - name: Send CODEGRIP release notification
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL_SDK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('mattermost_payload.json').write_text(json.dumps({'text': Path('message.txt').read_text()}))
          PY
          curl --fail-with-body -X POST -H 'Content-Type: application/json' --data @mattermost_payload.json "$MATTERMOST_WEBHOOK_URL"
