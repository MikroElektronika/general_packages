name: Clock graphs

on:
  pull_request:
    paths:
      - "clock_graphs/**"
      - "scripts/clock_graphs/**"
      - ".github/workflows/clock-graphs-check.yml"
  push:
    branches:
      - main
    paths:
      - "clock_graphs/**"
      - "scripts/clock_graphs/**"
      - ".github/workflows/clock-graphs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The STM32 and Microchip SAM graphs are generated: the committed JSON must match the generators.
      - name: Check generated graphs
        run: |
          python scripts/clock_graphs/stm32_graphs.py
          python scripts/clock_graphs/microchip_sam_graphs.py
          git diff --exit-code -- clock_graphs/stm32 clock_graphs/microchip_sam || {
            echo "::error::Generated clock graphs are out of date: run the generators in scripts/clock_graphs and commit the result."
            exit 1
          }
          test -z "$(git status --porcelain -- clock_graphs/stm32 clock_graphs/microchip_sam)" || {
            echo "::error::A generator wrote a graph that is not committed."
            exit 1
          }

      # Structure, expressions and index.json freshness. Packaging into clock_graphs.7z is done by
      # the Package Release Assets workflow (scripts/package.py picks up clock_graphs/manifest.json).
      - name: Validate clock graphs
        run: python scripts/clock_graphs/validate.py
