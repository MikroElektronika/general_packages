name: Notify CODEGRIP Release Mattermost

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements/shared.txt
          pip install -r scripts/requirements/databases.txt

      - name: Build CODEGRIP message
        id: build_message
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: |
          python -u scripts/database/build_message_codegrip.py \
            'NECTO DAILY UPDATE' '${{ secrets.RELEASES_SPREADSHEET }}' '${{ secrets.ES_INDEX_LIVE }}'

      - name: Send Product Release notification
        if: steps.build_message.outputs.has_packages == 'true'
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('mattermost_payload.json').write_text(json.dumps({'text': Path('message.txt').read_text()}))
          PY
          curl --fail-with-body -X POST -H 'Content-Type: application/json' --data @mattermost_payload.json "$MATTERMOST_WEBHOOK_URL"
